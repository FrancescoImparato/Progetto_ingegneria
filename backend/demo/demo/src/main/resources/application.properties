spring.application.name=demo
spring.application.name=sidequest-backend
server.port=8080

# H2 persistente su file (i dati restano salvati anche riavviando il server)
spring.datasource.url=jdbc:h2:file:./data/sidequestdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console H2 utile in sviluppo (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Configurazione JWT (in produzione va in variabile d'ambiente)
app.jwt.secret=ChiaveSegretaMoltoLungaPerSideQuest20262027Almeno32Byte!
app.jwt.expiration-ms=86400000